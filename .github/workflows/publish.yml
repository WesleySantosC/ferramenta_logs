name: Publish Python SDK

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:

  publish:

    runs-on: ubuntu-latest

    environment:
      name: pypi

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build


      - name: Build SDK
        working-directory: sdk/python
        run: |
          python -m build


      - name: Verify package files
        run: |
          echo "Root:"
          ls -la

          echo "SDK:"
          ls -la sdk/python

          echo "Distribution:"
          ls -la sdk/python/dist


      - name: Test SDK installation
        working-directory: sdk/python
        run: |
          pip install dist/*.whl
          python -c "from openobserve import OpenObserve; print('SDK import OK')"


      - name: Publish PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist