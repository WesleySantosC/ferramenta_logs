<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Login | OpenObserve
</title>


<link rel="stylesheet"
href="../css/variables.css">


<link rel="stylesheet"
href="../css/reset.css">


<link rel="stylesheet"
href="../css/style.css">


<link rel="stylesheet"
href="../css/login.css">

</head>


<body>


<div class="login-container">


<div class="login-card">


<div class="login-header">

<h1>
OpenObserve
</h1>

<p>
Entre na plataforma
</p>

</div>



<form id="loginForm">


<div class="form-group">

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="admin@email.com"
required>

</div>



<div class="form-group">

<label>
Senha
</label>

<input
id="password"
type="password"
placeholder="********"
required>

</div>



<button
type="submit"
class="btn btn-primary">

Entrar

</button>


</form>


</div>


</div>



<script src="../js/config.js"></script>

<script src="../js/auth.js"></script>

<script src="../js/api.js"></script>

<script src="../js/login.js"></script>


</body>

</html>
