<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Tokens | OpenObserve
</title>


<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/table.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/tokens.css">


</head>


<body>


<div class="layout">


<div id="sidebar"></div>


<div class="content">


<div id="header"></div>



<main id="page-content">


<section class="panel">


<div class="panel-header flex-between">


<h2>
Tokens da API
</h2>


<button 
class="btn btn-primary"
onclick="openTokenModal()">

Novo Token

</button>


</div>



<table class="data-table">


<thead>

<tr>

<th>
Nome
</th>

<th>
Aplicação
</th>

<th>
Projeto
</th>

<th>
Status
</th>

<th>
Criado em
</th>

<th>
Ações
</th>

</tr>


</thead>


<tbody id="tokensTable">


<tr>

<td colspan="6">
Carregando...
</td>

</tr>


</tbody>


</table>


</section>


</main>



</div>


</div>



<div id="tokenModal"
class="modal hidden">


<div class="modal-content">


<h3>
Criar Token
</h3>



<div id="createTokenForm">


<label>
Nome
</label>


<input 
id="tokenName"
placeholder="Ex: backend-api">



<label>
Projeto ID
</label>


<input 
id="projectId"
type="number"
placeholder="1">


</div>



<div id="generatedToken"
class="token-box hidden">


<p>
Token criado:
</p>


<div class="token-display">


<span id="tokenValue"></span>


<button
onclick="copyToken()">

Copiar

</button>


</div>


<p class="token-warning">

Guarde este token. Ele não será mostrado novamente.

</p>


</div>




<div class="modal-actions">


<button
class="btn-secondary"
onclick="closeTokenModal()">

Fechar

</button>



<button
id="createTokenButton"
class="btn btn-primary"
onclick="createToken()">

Criar

</button>


</div>


</div>


</div>




<script src="https://unpkg.com/lucide@0.468.0"></script>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/tokens.js"></script>


</body>

</html>
