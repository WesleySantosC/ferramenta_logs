<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Dashboard | OpenObserve
</title>


<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/dashboard.css">


</head>


<body>


<div class="layout">


<div id="sidebar"></div>


<div class="content">


<div id="header"></div>



<main id="page-content">



<section class="page-header">


<div>

<h1>
Dashboard
</h1>


<p>
Visão geral da plataforma de observabilidade
</p>


</div>


</section>





<section class="dashboard-grid">



<div class="stat-card">


<span class="stat-label">
Total de Logs
</span>


<strong 
id="totalLogs"
class="stat-value">

0

</strong>


</div>





<div class="stat-card">


<span class="stat-label">
Erros
</span>


<strong 
id="errorLogs"
class="stat-value danger">

0

</strong>


</div>





<div class="stat-card">


<span class="stat-label">
Warnings
</span>


<strong 
id="warningLogs"
class="stat-value warning">

0

</strong>


</div>





<div class="stat-card">


<span class="stat-label">
Aplicações
</span>


<strong 
id="applications"
class="stat-value">

0

</strong>


</div>



</section>







<section class="dashboard-panel">


<header class="panel-header">

<h2>
Atividade recente
</h2>


</header>



<div 
id="timeline"
class="timeline">

Carregando...

</div>


</section>








<section class="charts-grid">



<div class="dashboard-panel">


<header class="panel-header">

<h2>
Distribuição dos Logs
</h2>


</header>



<div class="chart-container">

<canvas id="logsLevelChart"></canvas>

</div>


</div>







<div class="dashboard-panel">


<header class="panel-header">

<h2>
Logs por Aplicação
</h2>


</header>



<div class="chart-container">

<canvas id="applicationsChart"></canvas>

</div>


</div>




</section>





</main>


</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/lucide@0.468.0"></script>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/dashboard.js"></script>


</body>

</html>
