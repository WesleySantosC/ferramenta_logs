[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "openobserve-client"
version = "0.1.3"
description = "Python SDK for OpenObserve Logs"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests"
]


[tool.setuptools.packages.find]
where = ["."]